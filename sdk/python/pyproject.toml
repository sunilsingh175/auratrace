[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auratrace-sdk"
version = "1.0.0"
description = "AuraTrace Python SDK — zero-config crash capture"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "AuraTrace Team" }]
keywords = ["observability", "crash-reporting", "aiops", "monitoring"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

dependencies = []  # Zero external deps — uses stdlib only

[project.urls]
Homepage = "https://github.com/your-org/auratrace"
Documentation = "https://docs.auratrace.dev"

[tool.setuptools.packages.find]
where = ["."]
include = ["auratrace*"]
