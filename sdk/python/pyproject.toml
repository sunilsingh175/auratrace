[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auratrace"
version = "2.0.0"
authors = [{ name="Sunil Singh", email="sunilsinghrajput192@gmail.com" }]
description = "Official Python automatic crash-capture and AI diagnostics SDK for AuraTrace"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.24.0",
]

[tool.setuptools]
packages = ["auratrace"]

[project.urls]
"Homepage" = "https://github.com/sunilsingh175/auratrace"
