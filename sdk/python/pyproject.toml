[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auratrace"
version = "2.0.0"
description = "AuraTrace Python automatic crash-capture and AI diagnostics SDK"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "AuraTrace Team" }
]
keywords = ["observability", "crash-reporting", "aiops", "monitoring"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/sunilsingh175/auratrace"

[tool.setuptools.packages.find]
where = ["."]
include = ["auratrace*"]
