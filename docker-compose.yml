services:
  # ============================================================================
  # PostgreSQL + pgvector
  # ============================================================================
  postgres-db:
    image: pgvector/pgvector:pg16
    container_name: auratrace-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/02-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - auratrace-net

  # ============================================================================
  # Redis 7.2
  # ============================================================================
  redis-broker:
    image: redis:7.2-alpine
    container_name: auratrace-redis
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    ports:
      - "${REDIS_PORT}:6379"

    volumes:
      - redisdata:/data

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

    networks:
      - auratrace-net

  # ============================================================================
  # FastAPI Ingestion Gateway
  # ============================================================================
  ingestion-service:
    build:
      context: .
      dockerfile: backend/ingestion_service/Dockerfile

    container_name: auratrace-ingestion
    restart: unless-stopped

    environment:
      DATABASE_URL: ${DATABASE_URL}

      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_STREAM_KEY: ${REDIS_STREAM_KEY}

      REDIS_ANOMALY_CHANNEL: ${REDIS_ANOMALY_CHANNEL}

      AURA_MASTER_API_KEY: ${AURA_MASTER_API_KEY}
      AURA_AUTH_SECRET: ${AURA_AUTH_SECRET}
      AURA_ADMIN_REGISTRATION_KEY: ${AURA_ADMIN_REGISTRATION_KEY}
      ENABLE_API_AUTH: ${ENABLE_API_AUTH:-false}

      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-startuphub695@gmail.com}

      INGESTION_SERVICE_PORT: ${INGESTION_SERVICE_PORT}

    ports:
      - "${INGESTION_SERVICE_PORT}:8000"

    volumes:
      - ./backend:/app/backend

    depends_on:
      postgres-db:
        condition: service_healthy
      redis-broker:
        condition: service_healthy

    networks:
      - auratrace-net

  # ============================================================================
  # ML Anomaly Detection Worker
  # ============================================================================
  ml-anomaly-service:
    build:
      context: .
      dockerfile: backend/ml_anomaly_service/Dockerfile

    container_name: auratrace-ml-worker
    restart: unless-stopped

    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}

      REDIS_STREAM_KEY: ${REDIS_STREAM_KEY}
      REDIS_ANOMALY_CHANNEL: ${REDIS_ANOMALY_CHANNEL}
      REDIS_CONSUMER_GROUP: ${REDIS_CONSUMER_GROUP}

      # Redis pending-message recovery
      REDIS_PENDING_IDLE_TIME_MS: "1000"

      ANOMALY_THRESHOLD: ${ANOMALY_THRESHOLD:-0.75}
      ANOMALY_CONTAMINATION: ${ANOMALY_CONTAMINATION}
      ANOMALY_WINDOW_SIZE_SECONDS: ${ANOMALY_WINDOW_SIZE_SECONDS}
      ANOMALY_POLL_INTERVAL_MS: ${ANOMALY_POLL_INTERVAL_MS}

      DATABASE_URL: ${DATABASE_URL}

    depends_on:
      postgres-db:
        condition: service_healthy
      redis-broker:
        condition: service_healthy

    networks:
      - auratrace-net

  # ============================================================================
  # RAG AI Diagnostic Doctor
  # ============================================================================
  rag-diagnostic-service:
    build:
      context: .
      dockerfile: backend/rag-diagnostic-service/Dockerfile

    container_name: auratrace-rag-doctor
    restart: unless-stopped

    environment:
      DATABASE_URL: ${DATABASE_URL}

      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_ANOMALY_CHANNEL: ${REDIS_ANOMALY_CHANNEL}

      LLM_PROVIDER: ${LLM_PROVIDER}

      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}

      EMBEDDING_MODEL: ${EMBEDDING_MODEL}

    depends_on:
      postgres-db:
        condition: service_healthy
      redis-broker:
        condition: service_healthy

    networks:
      - auratrace-net

  # ============================================================================
  # Next.js Frontend
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: auratrace-frontend
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      # Server-side Docker communication
      AURA_API_URL: http://ingestion-service:8000

      # Browser-side communication
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}

      AURA_MASTER_API_KEY: ${AURA_MASTER_API_KEY}

    depends_on:
      ingestion-service:
        condition: service_started

    networks:
      - auratrace-net

# ==============================================================================
# Network
# ==============================================================================

networks:
  auratrace-net:
    driver: bridge

# ==============================================================================
# Persistent Volumes
# ==============================================================================

volumes:
  pgdata:
  redisdata:
