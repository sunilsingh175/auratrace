<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- Shield Emblem -->
  <g transform="translate(8, 6)">
    <!-- Outer Shield Frame -->
    <path d="M34 2 L60 12 C60 44 42 60 34 66 C26 60 8 44 8 12 Z" fill="#0f172a" stroke="#1e293b" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Inner Shield Red Fill -->
    <path d="M34 6 L56 15 C56 42 40 56 34 61 C28 56 12 42 12 15 Z" fill="#dc2626"/>
    
    <!-- Top Telemetry Matrix / Server dashes -->
    <g opacity="0.85" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round">
      <line x1="22" y1="22" x2="26" y2="22"/>
      <line x1="29" y1="22" x2="39" y2="22"/>
      <line x1="42" y1="22" x2="46" y2="22"/>
      
      <line x1="24" y1="26" x2="31" y2="26"/>
      <line x1="34" y1="26" x2="44" y2="26"/>
    </g>
    
    <!-- White Waveform / ECG Telemetry Pulse Line -->
    <path d="M12 36 L24 36 L27 43 L32 23 L37 47 L41 33 L44 36 L56 36" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography: AuraTrace -->
  <text x="84" y="38" font-family="'Montserrat', 'Inter', -apple-system, sans-serif" font-size="28" font-weight="900" fill="#0f172a" letter-spacing="-0.5">
    Aura<tspan fill="#dc2626">Trace</tspan>
  </text>
  <text x="84" y="58" font-family="'Lato', -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#64748b" letter-spacing="1.2">
    AUTONOMOUS OBSERVABILITY &amp; HEALING
  </text>
</svg>
