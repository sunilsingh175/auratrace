name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-validate:
    name: Lint & Python Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/shared/requirements.txt
          pip install ruff pytest

      - name: Compile Backend Modules
        run: |
          python -m py_compile backend/shared/*.py
          python -m py_compile backend/ingestion_service/*.py
          python -m py_compile backend/ml_anomaly_service/*.py
          python -m py_compile backend/rag_service/*.py
          python -m py_compile backend/repair_engine/*.py

  build-frontend:
    name: Build Next.js Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Next.js Production Bundle
        working-directory: ./frontend
        run: npm run build
