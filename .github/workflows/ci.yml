name: AuraTrace Autonomous Healing CI

on:
  push:
    branches: [ "main", "feat/*", "auratrace/repair/**" ]
  pull_request:
    branches: [ "main", "feat/*" ]

jobs:
  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SDK
        run: |
          python -m pip install --upgrade pip
          pip install -e sdk/python
          pip install pytest pytest-asyncio

      - name: Run Python SDK tests
        run: pytest sdk/python/test_python_sdk.py

  node-sdk:
    name: Node.js SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/nodejs/package-lock.json

      - name: Install dependencies
        working-directory: sdk/nodejs
        run: npm ci

      - name: Build SDK
        working-directory: sdk/nodejs
        run: npm run build

      - name: Run SDK tests
        working-directory: sdk/nodejs
        run: npm test

      - name: Verify package contents
        working-directory: sdk/nodejs
        run: npm run pack:check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  python-validation:
    name: Backend and ML Python validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio
          pip install -r backend/ingestion_service/requirements.txt
          pip install -r backend/ml_anomaly_service/requirements.txt
          pip install -r backend/rag-diagnostic-service/requirements.txt
          pip install -r backend/repair_engine/requirements.txt

      - name: Compile Python sources
        run: |
          python -m compileall -q backend sdk/python scripts

      - name: Run repository Python tests
        run: pytest -q

  demo-regression:
    name: Demo application regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run repair demo tests
        run: pytest test_app.py
