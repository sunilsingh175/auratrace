name: AuraTrace Autonomous Healing CI

on:
  push:
    branches: [ "main", "feat/*", "auratrace/repair/**" ]
  pull_request:
    branches: [ "main", "feat/*" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run test suite
        run: |
          pytest test_app.py
